<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>دمج سؤال في قالب</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body {
  background:#0f172a;
  color:#fff;
  font-family:Cairo,Arial;
  text-align:center;
}
.box {
  max-width:650px;
  margin:auto;
  background:#020617;
  padding:20px;
  border-radius:15px;
}
input,button {
  width:100%;
  margin:10px 0;
  padding:12px;
  border-radius:8px;
}
button {
  background:#38bdf8;
  font-size:18px;
  cursor:pointer;
}
canvas {
  margin-top:15px;
  border-radius:10px;
}
</style>
</head>

<body>
<div class="box">
  <h2>🖼️ دمج سؤال من صورة داخل قالب</h2>

  <label>📸 صورة السؤال</label>
  <input type="file" id="questionImg" accept="image/*">

  <label>🎨 صورة القالب</label>
  <input type="file" id="templateImg" accept="image/*">

  <button onclick="extractText()">🔍 استخراج السؤال</button>
  <button onclick="merge()">✨ دمج في القالب</button>

  <canvas id="canvas" width="800" height="450"></canvas>

  <button onclick="download()">⬇️ تحميل الصورة</button>
</div>

<script>
let extractedText = "";

function extractText(){
  const img = document.getElementById("questionImg").files[0];
  if(!img) return alert("ارفع صورة السؤال");

  Tesseract.recognize(img, 'ara+eng').then(res=>{
    extractedText = res.data.text;
    alert("تم استخراج النص ✔️");
  });
}

function merge(){
  const template = document.getElementById("templateImg").files[0];
  if(!template || !extractedText) return alert("ارفع القالب واستخرج النص");

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const img = new Image();
  img.onload = ()=>{
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    ctx.fillStyle="#000";
    ctx.font="22px Arial";
    ctx.textAlign="right";

    let y = 80;
    extractedText.split("\n").forEach(line=>{
      if(line.trim()){
        ctx.fillText(line, canvas.width - 40, y);
        y += 35;
      }
    });
  };
  img.src = URL.createObjectURL(template);
}

function download(){
  const link = document.createElement("a");
  link.download="final-question.png";
  link.href=document.getElementById("canvas").toDataURL();
  link.click();
}
</script>
</body>
</html>
