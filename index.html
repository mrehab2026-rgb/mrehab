<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محول الدرس لاختبار ذكي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family:'Cairo',sans-serif; }
    body { background:#f5f7fa; padding:20px; }
    h1 { text-align:center; margin-bottom:20px; color:#2c3e50; }
    textarea { width:100%; height:200px; padding:10px; font-size:16px; border-radius:10px; border:1px solid #ccc; margin-bottom:15px; resize:vertical; }
    button { background:#3498db; color:#fff; border:none; padding:12px 20px; border-radius:8px; cursor:pointer; font-size:16px; transition:0.3s; }
    button:hover { background:#2980b9; }
    .quiz-container { margin-top:30px; }
    .question-card { background:#fff; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .question-text { font-weight:700; margin-bottom:15px; color:#34495e; }
    .options { list-style:none; }
    .options li { margin-bottom:10px; }
    .options input[type="radio"] { margin-right:10px; }
    .loading { text-align:center; font-weight:700; margin-top:20px; color:#e67e22; }
  </style>
</head>
<body>
  <h1>محول الدرس لاختبار ذكي</h1>
  <textarea id="lesson" placeholder="ضع محتوى الدرس هنا"></textarea>
  <button onclick="generateQuestions()">حوّل للدرس لاختبار</button>
  <div class="loading" id="loading" style="display:none;">جاري توليد الأسئلة...</div>
  <div class="quiz-container" id="quiz"></div>

  <script>
    async function generateQuestions() {
      const lesson = document.getElementById('lesson').value.trim();
      if(!lesson) return alert("الرجاء إدخال محتوى الدرس!");

      document.getElementById('quiz').innerHTML = '';
      document.getElementById('loading').style.display = 'block';

      // استدعاء OpenAI API
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer YOUR_OPENAI_API_KEY"
        },
        body: JSON.stringify({
          model: "gpt-4",
          messages: [
            {
              role: "system",
              content: "أنت معلم خبير يقوم بتحويل أي درس إلى أسئلة موضوعية (اختيارات) وأسئلة مقالية."
            },
            {
              role: "user",
              content: `حول النص التالي إلى مجموعة أسئلة منظمة. اجعل نصفها موضوعي بأربع اختيارات ونصفها مقالي، مع إعطاء كل سؤال رقمًا:
              ${lesson}`
            }
          ],
          temperature: 0.7
        })
      });

      const data = await response.json();
      const text = data.choices[0].message.content;

      // تحويل النص الناتج لكل سؤال إلى بطاقات
      const container = document.getElementById('quiz');
      const questions = text.split(/\n(?=\d+\.)/); // كل سؤال يبدأ برقم
      questions.forEach(q => {
        const card = document.createElement('div');
        card.classList.add('question-card');

        const questionText = document.createElement('div');
        questionText.classList.add('question-text');
        questionText.textContent = q;
        card.appendChild(questionText);

        container.appendChild(card);
      });

      document.getElementById('loading').style.display = 'none';
    }
  </script>
</body>
</html>
