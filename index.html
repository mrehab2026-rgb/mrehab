<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>استعلام النتيجة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #result {
      margin-top: 20px;
      text-align: left;
    }
    h3 {
      margin: 5px 0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>استعلام النتيجة</h2>
    <input type="text" id="seat" placeholder="أدخل رقم الجلوس" />
    <button onclick="getResult()">استعلام</button>

    <div id="result"></div>
  </div>

  <script>
    const WEB_APP_URL = "ضع هنا رابط الـ Web App من Google Script";

    function getResult(){
      const seat = document.getElementById("seat").value.trim();
      if(seat === "") {
        alert("من فضلك أدخل رقم الجلوس");
        return;
      }

      fetch(`${WEB_APP_URL}?seat=${seat}`)
        .then(res => res.json())
        .then(data => {
          const resultDiv = document.getElementById("result");
          if(Object.keys(data).length === 0){
            resultDiv.innerHTML = "<p style='color:red'>رقم الجلوس غير موجود</p>";
          } else {
            resultDiv.innerHTML = `
              <h3>اسم الطالب: ${data.name}</h3>
              المدرسة: ${data.school}<br>
              المادة1: ${data.subject1}<br>
              المادة2: ${data.subject2}<br>
              المادة3: ${data.subject3}<br>
              المجموع: ${data.total}
            `;
          }
        })
        .catch(err => {
          console.error(err);
          alert("حدث خطأ أثناء جلب النتيجة");
        });
    }
  </script>
</body>
</html>
