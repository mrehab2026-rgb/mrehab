<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الامتحانات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #f0f2f5; font-family: Tahoma, sans-serif; }
        .main-container { max-width: 600px; margin: 50px auto; padding: 20px; }
        .search-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .result-box { display: none; margin-top: 20px; border-top: 4px solid #198754; }
        .student-info p { font-size: 1.1rem; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .total-score { background-color: #198754; color: white; padding: 10px; border-radius: 8px; text-align: center; font-size: 1.5rem; font-weight: bold; }
        .loading { display: none; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="search-card text-center">
        <h2 class="mb-4 text-primary">عرض النتائج</h2>
        <p class="text-muted">أدخل رقم الجلوس لعرض النتيجة فوراً</p>
        
        <div class="mb-3">
            <input type="number" id="seatInput" class="form-control form-control-lg text-center" placeholder="رقم الجلوس">
        </div>
        <button onclick="searchResult()" class="btn btn-primary btn-lg w-100">بحث</button>
        
        <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status"></div>
            <p>جاري البحث في الكشوف...</p>
        </div>
        <div id="errorMsg" class="alert alert-danger mt-3" style="display:none;"></div>
    </div>

    <div id="resultCard" class="search-card result-box">
        <h3 class="text-center mb-4 text-success">تفاصيل النتيجة</h3>
        <div class="student-info">
            <p><strong>الاسم:</strong> <span id="r_name"></span></p>
            <p><strong>رقم الجلوس:</strong> <span id="r_seat"></span></p>
            <p><strong>المدرسة:</strong> <span id="r_school"></span></p>
            <p><strong>الحالة:</strong> <span id="r_status"></span></p>
        </div>
        <div class="total-score mt-3">
            المجموع: <span id="r_total"></span> 
            <br>
            <span style="font-size: 1rem;">النسبة: <span id="r_percent"></span>%</span>
        </div>
        <button onclick="location.reload()" class="btn btn-outline-secondary w-100 mt-3">بحث جديد</button>
    </div>
</div>

<script>
    // ==========================================
    // ضع رابط ملف الشيت (CSV) هنا مكان الرابط ده
    // ==========================================
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vIyXz5qABCdeFGHIjqklmnOpQRstuvwxyza/pub?output=csv"; 
    // ملاحظة: الرابط أعلاه تجريبي، استبدله برابطك الخاص

    function searchResult() {
        let seatNo = document.getElementById('seatInput').value.trim();
        let loading = document.getElementById('loading');
        let errorMsg = document.getElementById('errorMsg');
        let resultCard = document.getElementById('resultCard');

        if (!seatNo) {
            alert("يرجى كتابة رقم الجلوس");
            return;
        }

        loading.style.display = 'block';
        errorMsg.style.display = 'none';
        resultCard.style.display = 'none';

        // استخدام PapaParse لقراءة ملف CSV من جوجل شيت
        Papa.parse(sheetURL, {
            download: true,
            header: true, // عشان يفهم العناوين (الصف الأول)
            complete: function(results) {
                loading.style.display = 'none';
                let found = false;
                
                // البحث داخل البيانات
                for (let i = 0; i < results.data.length; i++) {
                    let row = results.data[i];
                    // مقارنة رقم الجلوس (العمود الأول في الشيت)
                    // تأكد أن اسم العمود في الشيت هو "رقم الجلوس" أو غير الكلمة هنا
                    if (row['رقم الجلوس'] && row['رقم الجلوس'].trim() === seatNo) {
                        showResult(row);
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    errorMsg.innerText = "رقم الجلوس غير موجود، تأكد من الرقم وحاول مجدداً.";
                    errorMsg.style.display = 'block';
                }
            },
            error: function(err) {
                loading.style.display = 'none';
                errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
                errorMsg.style.display = 'block';
            }
        });
    }

    function showResult(data) {
        // ربط البيانات بالعرض
        document.getElementById('r_name').innerText = data['اسم الطالب'];
        document.getElementById('r_seat').innerText = data['رقم الجلوس'];
        document.getElementById('r_school').innerText = data['المدرسة'];
        document.getElementById('r_total').innerText = data['المجموع'];
        document.getElementById('r_percent').innerText = data['النسبة المئوية'];
        document.getElementById('r_status').innerText = data['حالة الطالب'];
        
        document.getElementById('resultCard').style.display = 'block';
    }
</script>

</body>
</html>
