<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>أداة تحويل صورة سؤال إلى قالب</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0f172a;
  color: #fff;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
  background: #020617;
  padding: 20px;
  border-radius: 15px;
}
input, textarea, button {
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
}
textarea {
  height: 100px;
}
button {
  background: #38bdf8;
  font-size: 18px;
  cursor: pointer;
}
canvas {
  margin-top: 20px;
  background: #fff;
  border-radius: 10px;
}
</style>
</head>

<body>
<div class="container">
  <h2>📸 تحويل صورة سؤال إلى قالب احترافي</h2>

  <input type="file" id="imgInput" accept="image/*">

  <button onclick="extractText()">🔍 استخراج السؤال</button>

  <textarea id="textOutput" placeholder="سيظهر السؤال والاختيارات هنا"></textarea>

  <button onclick="generateImage()">🖼️ توليد صورة السؤال</button>

  <canvas id="canvas" width="600" height="400"></canvas>

  <button onclick="downloadImage()">⬇️ تحميل الصورة</button>
</div>

<script>
function extractText() {
  const file = document.getElementById('imgInput').files[0];
  if (!file) return alert("ارفع صورة الأول");

  Tesseract.recognize(file, 'ara+eng').then(result => {
    document.getElementById('textOutput').value = result.data.text;
  });
}

function generateImage() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const text = document.getElementById('textOutput').value;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#000";
  ctx.font = "20px Arial";
  ctx.textAlign = "right";

  let y = 50;
  text.split('\n').forEach(line => {
    ctx.fillText(line, 550, y);
    y += 30;
  });
}

function downloadImage() {
  const canvas = document.getElementById('canvas');
  const link = document.createElement('a');
  link.download = "question.png";
  link.href = canvas.toDataURL();
  link.click();
}
</script>
</body>
</html>
