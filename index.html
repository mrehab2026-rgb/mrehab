<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النتائج الرسمية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --success-color: #2ecc71;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #e0eafc; 
            background: -webkit-linear-gradient(to right, #cfdef3, #e0eafc); 
            background: linear-gradient(to right, #cfdef3, #e0eafc); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* الكارت الرئيسي */
        .main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }

        h1 { color: #2d3436; font-weight: 800; margin-bottom: 10px; }
        p.subtitle { color: #636e72; margin-bottom: 30px; font-size: 0.95rem; }

        /* حقل الإدخال */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 2px solid #e1e1e1;
            border-radius: 15px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2bec3;
            font-size: 1.2rem;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        /* الزر */
        .btn-search {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Cairo', sans-serif;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }

        /* قسم النتائج */
        #resultSection {
            display: none;
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-header {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px dashed #ced6e0;
        }

        .student-name { color: var(--secondary-color); font-weight: 800; font-size: 1.3rem; margin: 0; }
        
        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .score-item {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border-bottom: 3px solid transparent;
        }

        .score-item.highlight { border-color: var(--primary-color); }
        .score-item.success { border-color: var(--success-color); }

        .score-label { font-size: 0.8rem; color: #636e72; display: block; margin-bottom: 5px; }
        .score-value { font-size: 1.4rem; font-weight: 800; color: #2d3436; }

        .total-badge {
            background: var(--success-color);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .btn-outline {
            flex: 1;
            background: transparent;
            border: 2px solid #dfe6e9;
            color: #636e72;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
        }
        .btn-outline:hover { border-color: var(--primary-color); color: var(--primary-color); }

        /* Loader */
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="main-card">
        
        <div id="searchSection">
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-graduation-cap fa-3x" style="color: var(--primary-color);"></i>
            </div>
            <h1>نتيجة الشهادة الثانوية</h1>
            <p class="subtitle">أدخل رقم الجلوس للاطلاع على النتيجة فوراً</p>
            
            <div class="input-group">
                <input type="number" id="seatInput" placeholder="رقم الجلوس" onkeypress="handleEnter(event)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            
            <button class="btn-search" onclick="searchResult()">عرض النتيجة</button>
            <div class="loader" id="loader"></div>
        </div>

        <div id="resultSection">
            <div class="student-header">
                <p class="score-label">اسم الطالب</p>
                <h2 class="student-name" id="res_name">--</h2>
                <p style="margin: 5px 0 0; font-size: 0.9rem; color: #636e72;">
                    <i class="fa-solid fa-school"></i> <span id="res_school">--</span>
                </p>
            </div>

            <div class="score-grid">
                <div class="score-item highlight">
                    <span class="score-label">رقم الجلوس</span>
                    <span class="score-value" id="res_seat">--</span>
                </div>
                <div class="score-item success">
                    <span class="score-label">الحالة</span>
                    <span class="score-value" id="res_status" style="color:var(--success-color)">--</span>
                </div>
                <div class="score-item">
                    <span class="score-label">النسبة المئوية</span>
                    <span class="score-value" id="res_percent">--%</span>
                </div>
            </div>

            <div class="total-badge">
                <span style="display: block; font-size: 0.9rem; opacity: 0.9;">المجموع الكلي</span>
                <span style="font-size: 2rem; font-weight: 800;" id="res_total">--</span>
            </div>

            <div class="actions">
                <button class="btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
                <button class="btn-outline" onclick="resetSearch()"><i class="fa-solid fa-rotate-right"></i> بحث آخر</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        //  👇 ضع رابط ملف الشيت (CSV) هنا 👇
        // ==========================================
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vIyXz5qABCdeFGHIjqklmnOpQRstuvwxyza/pub?output=csv";
        // ==========================================

        function handleEnter(e) {
            if(e.key === 'Enter') searchResult();
        }

        function searchResult() {
            const seatNo = document.getElementById('seatInput').value.trim();
            const loader = document.getElementById('loader');
            const btn = document.querySelector('.btn-search');

            if (!seatNo) {
                Swal.fire({
                    icon: 'warning',
                    title: 'تنبيه',
                    text: 'يرجى كتابة رقم الجلوس أولاً',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#4361ee'
                });
                return;
            }

            // تفعيل التحميل
            btn.style.display = 'none';
            loader.style.display = 'block';

            Papa.parse(sheetURL, {
                download: true,
                header: true,
                complete: function(results) {
                    let foundStudent = null;
                    
                    // البحث في البيانات
                    for (let i = 0; i < results.data.length; i++) {
                        // مقارنة مرنة (تحويل لنصوص وإزالة مسافات)
                        if (results.data[i]['رقم الجلوس'] && results.data[i]['رقم الجلوس'].toString().trim() == seatNo) {
                            foundStudent = results.data[i];
                            break;
                        }
                    }

                    // إخفاء التحميل
                    loader.style.display = 'none';

                    if (foundStudent) {
                        showData(foundStudent);
                    } else {
                        btn.style.display = 'block';
                        Swal.fire({
                            icon: 'error',
                            title: 'غير موجود',
                            text: 'تأكد من رقم الجلوس وحاول مرة أخرى',
                            confirmButtonText: 'إعادة المحاولة',
                            confirmButtonColor: '#d63031'
                        });
                    }
                },
                error: function() {
                    loader.style.display = 'none';
                    btn.style.display = 'block';
                    Swal.fire('خطأ', 'حدث خطأ في الاتصال بالسيرفر', 'error');
                }
            });
        }

        function showData(data) {
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';

            // تعبئة البيانات (تأكد أن الأسماء هنا تطابق عناوين أعمدة الشيت)
            document.getElementById('res_name').innerText = data['اسم الطالب'];
            document.getElementById('res_seat').innerText = data['رقم الجلوس'];
            document.getElementById('res_school').innerText = data['المدرسة'];
            document.getElementById('res_total').innerText = data['المجموع'];
            document.getElementById('res_percent').innerText = data['النسبة المئوية'];
            document.getElementById('res_status').innerText = data['حالة الطالب'];

            // تشغيل تأثير الاحتفال (Confetti)
            triggerConfetti();
        }

        function resetSearch() {
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('seatInput').value = '';
            document.querySelector('.btn-search').style.display = 'block';
        }

        // دالة تأثير الاحتفال
        function triggerConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }
    </script>
</body>
</html>
